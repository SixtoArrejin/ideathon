<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Dosel · El bosque, verificado desde arriba (Pitch &amp; Demo 2:00)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f2f4ec;
        font-family: 'Inter', sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f2f4ec;
      }
      .scene-host {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      .captions-host {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        z-index: 20;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="120"
      data-width="1920"
      data-height="1080"
    >
      <!-- Track 0: 8 Visual Scenes (0.0s - 120.0s) -->
      <div
        id="host-scene-01"
        class="clip scene-host"
        data-composition-id="scene-01"
        data-composition-src="compositions/frames/01-problem.html"
        data-start="0"
        data-duration="14"
        data-track-index="0"
      ></div>

      <div
        id="host-scene-02"
        class="clip scene-host"
        data-composition-id="scene-02"
        data-composition-src="compositions/frames/02-solution.html"
        data-start="14"
        data-duration="14"
        data-track-index="0"
      ></div>

      <div
        id="host-scene-03"
        class="clip scene-host"
        data-composition-id="scene-03"
        data-composition-src="compositions/frames/03-predios.html"
        data-start="28"
        data-duration="16"
        data-track-index="0"
      ></div>

      <div
        id="host-scene-04"
        class="clip scene-host"
        data-composition-id="scene-04"
        data-composition-src="compositions/frames/04-freeze-validation.html"
        data-start="44"
        data-duration="18"
        data-track-index="0"
      ></div>

      <div
        id="host-scene-05"
        class="clip scene-host"
        data-composition-id="scene-05"
        data-composition-src="compositions/frames/05-market.html"
        data-start="62"
        data-duration="18"
        data-track-index="0"
      ></div>

      <div
        id="host-scene-06"
        class="clip scene-host"
        data-composition-id="scene-06"
        data-composition-src="compositions/frames/06-certificate.html"
        data-start="80"
        data-duration="16"
        data-track-index="0"
      ></div>

      <div
        id="host-scene-07"
        class="clip scene-host"
        data-composition-id="scene-07"
        data-composition-src="compositions/frames/07-business.html"
        data-start="96"
        data-duration="14"
        data-track-index="0"
      ></div>

      <div
        id="host-scene-08"
        class="clip scene-host"
        data-composition-id="scene-08"
        data-composition-src="compositions/frames/08-closing.html"
        data-start="110"
        data-duration="10"
        data-track-index="0"
      ></div>

      <!-- Track 1: Synchronized Voiceover Guide Captions (0.0s - 120.0s) -->
      <div
        id="host-captions"
        class="clip captions-host"
        data-composition-id="captions-overlay"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="120"
        data-track-index="1"
      ></div>

      <!-- Track 2: Mexican Spanish Neural Voiceover (es-MX-JorgeNeural) -->
      <audio id="vo-01" class="clip" src="assets/voiceover/vo-01.mp3" data-start="0.3" data-duration="13.27" data-track-index="2" data-volume="1.0"></audio>
      <audio id="vo-02" class="clip" src="assets/voiceover/vo-02.mp3" data-start="14.3" data-duration="13.29" data-track-index="2" data-volume="1.0"></audio>
      <audio id="vo-03" class="clip" src="assets/voiceover/vo-03.mp3" data-start="28.3" data-duration="15.26" data-track-index="2" data-volume="1.0"></audio>
      <audio id="vo-04" class="clip" src="assets/voiceover/vo-04.mp3" data-start="44.3" data-duration="17.28" data-track-index="2" data-volume="1.0"></audio>
      <audio id="vo-05" class="clip" src="assets/voiceover/vo-05.mp3" data-start="62.3" data-duration="16.66" data-track-index="2" data-volume="1.0"></audio>
      <audio id="vo-06" class="clip" src="assets/voiceover/vo-06.mp3" data-start="80.3" data-duration="15.28" data-track-index="2" data-volume="1.0"></audio>
      <audio id="vo-07" class="clip" src="assets/voiceover/vo-07.mp3" data-start="96.3" data-duration="13.17" data-track-index="2" data-volume="1.0"></audio>
      <audio id="vo-08" class="clip" src="assets/voiceover/vo-08.mp3" data-start="110.3" data-duration="9.28" data-track-index="2" data-volume="1.0"></audio>

      <!-- Track 3: Background Music (Ducked cleanly under Voiceover) -->
      <audio
        id="bgm-main"
        class="clip"
        src="assets/bgm/dosel-ambient.mp3"
        data-start="0"
        data-duration="120"
        data-track-index="3"
        data-volume="0.22"
        data-fade-in="2.0"
        data-fade-out="3.0"
      ></audio>

      <!-- Track 4: UI & Scene Transition Sound Effects -->
      <audio id="sfx-t1" class="clip" src="assets/sfx/transition-whoosh.mp3" data-start="13.8" data-duration="0.8" data-track-index="4" data-volume="0.28"></audio>
      <audio id="sfx-t2" class="clip" src="assets/sfx/transition-whoosh.mp3" data-start="27.8" data-duration="0.8" data-track-index="4" data-volume="0.28"></audio>
      <audio id="sfx-c1" class="clip" src="assets/sfx/ui-click.mp3" data-start="30.9" data-duration="0.18" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-a1" class="clip" src="assets/sfx/alert-freeze.mp3" data-start="45.7" data-duration="0.9" data-track-index="4" data-volume="0.32"></audio>
      <audio id="sfx-c2" class="clip" src="assets/sfx/ui-click.mp3" data-start="52.2" data-duration="0.18" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-c3" class="clip" src="assets/sfx/ui-click.mp3" data-start="68.3" data-duration="0.18" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-v2" class="clip" src="assets/sfx/chime-verify.mp3" data-start="73.4" data-duration="1.2" data-track-index="4" data-volume="0.32"></audio>
      <audio id="sfx-c4" class="clip" src="assets/sfx/ui-click.mp3" data-start="83.9" data-duration="0.18" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-v3" class="clip" src="assets/sfx/chime-verify.mp3" data-start="84.4" data-duration="1.2" data-track-index="4" data-volume="0.28"></audio>
      <audio id="sfx-v4" class="clip" src="assets/sfx/chime-verify.mp3" data-start="110.1" data-duration="1.2" data-track-index="4" data-volume="0.35"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
