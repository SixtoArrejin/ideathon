<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Dosel · El bosque, verificado desde arriba (Pitch &amp; Demo 2:00)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f2f4ec;
        font-family: 'Inter', sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f2f4ec;
      }
      .scene-host {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      .captions-host {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        z-index: 20;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="120"
      data-width="1920"
      data-height="1080"
    >
      <!-- Track 0: 8 Visual Scenes (0.0s - 120.0s) -->
      <div
        id="host-scene-01"
        class="clip scene-host"
        data-composition-id="scene-01"
        data-composition-src="compositions/frames/01-problem.html"
        data-start="0"
        data-duration="15.5"
        data-track-index="0"
      ></div>

      <div
        id="host-scene-02"
        class="clip scene-host"
        data-composition-id="scene-02"
        data-composition-src="compositions/frames/02-solution.html"

        data-duration="17.2"
        data-track-index="0"
      ></div>

      <div
        id="host-scene-03"
        class="clip scene-host"
        data-composition-id="scene-03"
        data-composition-src="compositions/frames/03-predios.html"

        data-duration="15.8"
        data-track-index="0"
      ></div>

      <div
        id="host-scene-04"
        class="clip scene-host"
        data-composition-id="scene-04"

        data-duration="18.5"
        data-track-index="0"
      ></div>

      <div
        id="host-scene-05"
        class="clip scene-host"

        data-track-index="0"

      <div
        id="host-scene-06"

        data-track-index="0"
      ></div>

      <div
        id="host-scene-07"
        class="clip scene-host"
        data-composition-id="scene-07"
        data-composition-src="compositions/frames/07-business.html"

      <div
        id="host-scene-08"
        class="clip scene-host"
        data-composition-id="scene-08"
        data-composition-src="compositions/frames/08-closing.html"
        data-start="108.6"
        data-duration="11.4"
        data-track-index="0"
      ></div>

      <!-- Track 1: Synchronized Voiceover Guide Captions (0.0s - 120.0s) -->
      <div
        id="host-captions"
        class="clip captions-host"
        data-composition-id="captions-overlay"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="120"
        data-track-index="1"
      ></div>

      <!-- Track 2: Team Real Voiceover (vo-01.mp3 to vo-08.mp3) -->
      <audio id="vo-01" class="clip" src="assets/voiceover/vo-01.mp3" data-start="0.2" data-duration="15.21" data-track-index="2" data-volume="1.0"></audio>
      <audio id="vo-02" class="clip" src="assets/voiceover/vo-02.mp3" data-start="15.7" data-duration="16.81" data-track-index="2" data-volume="1.0"></audio>

      <audio
        id="bgm-main"
        class="clip"
        src="assets/bgm/dosel-ambient.mp3"
        data-start="0"
        data-duration="120"
        data-track-index="3"
        data-volume="0.22"
        data-fade-in="2.0"
        data-fade-out="3.0"
      ></audio>

      <!-- Track 4: UI & Scene Transition Sound Effects -->
      <audio id="sfx-t1" class="clip" src="assets/sfx/transition-whoosh.mp3" data-start="15.1" data-duration="0.8" data-track-index="4" data-volume="0.28"></audio>
      <audio id="sfx-t2" class="clip" src="assets/sfx/transition-whoosh.mp3" data-start="32.3" data-duration="0.8" data-track-index="4" data-volume="0.28"></audio>

      <audio id="sfx-a1" class="clip" src="assets/sfx/alert-freeze.mp3" data-start="50.2" data-duration="0.9" data-track-index="4" data-volume="0.32"></audio>
      <audio id="sfx-c2" class="clip" src="assets/sfx/ui-click.mp3" data-start="56.7" data-duration="0.18" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-c3" class="clip" src="assets/sfx/ui-click.mp3" data-start="73.3" data-duration="0.18" data-track-index="4" data-volume="0.35"></audio>

      <audio id="sfx-v3" class="clip" src="assets/sfx/chime-verify.mp3" data-start="87.4" data-duration="1.2" data-track-index="4" data-volume="0.28"></audio>
      <audio id="sfx-v4" class="clip" src="assets/sfx/chime-verify.mp3" data-start="108.7" data-duration="1.2" data-track-index="4" data-volume="0.35"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
